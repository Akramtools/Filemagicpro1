<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI OCR + Table Format | ChatGPT Style</title>
  <!-- Tesseract pehle load karo HEAD mein -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0a0f0d;font-family:'Segoe UI',system-ui,sans-serif;color:#e2f0e6;padding:20px;}
    .container{max-width:1100px;margin:0 auto;}
    .card{background:#141e18;border-radius:28px;border:1px solid #2a3a2e;margin-bottom:24px;}
    .card-header{padding:20px 24px;background:#0f1712;border-bottom:1px solid #2a3a2e;display:flex;justify-content:space-between;flex-wrap:wrap;}
    .card-header h2{font-size:1.6rem;background:linear-gradient(135deg,#b9ffb0,#4ade80);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .ai-badge{background:#1e2a22;padding:4px 12px;border-radius:40px;font-size:0.7rem;color:#9eff9e;}
    .drop-zone{border:2px dashed #3a5a3e;border-radius:24px;margin:24px;padding:48px 24px;text-align:center;cursor:pointer;background:#0c1410;transition:0.2s;}
    .drop-zone.drag-over{border-color:#4ade80;background:#1e2e22;}
    .drop-icon{font-size:3rem;}
    .drop-title{font-weight:600;font-size:1.1rem;margin:8px 0 4px;}
    .drop-sub{font-size:0.8rem;color:#8aa69a;}
    .file-input{display:none;}
    .lang-row{display:flex;flex-wrap:wrap;gap:12px;margin:0 24px 16px 24px;align-items:center;justify-content:space-between;}
    .lang-selector select{background:#0c1410;border:1px solid #3a5a3e;border-radius:32px;padding:8px 16px;color:#e2f0e6;}
    .btn-preprocess{background:#2a4a2e;border:none;border-radius:32px;padding:8px 18px;color:white;cursor:pointer;}
    .progress-box{margin:0 24px 20px 24px;display:none;}
    .progress-bar{height:6px;background:#2a3a2e;border-radius:6px;overflow:hidden;}
    .progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#4ade80,#a0ffa0);transition:width 0.2s;}
    .status-text{font-size:0.8rem;color:#9abfaa;text-align:center;margin-top:8px;}
    .image-preview{margin:0 24px 16px 24px;display:none;text-align:center;}
    .image-preview img{max-width:100%;max-height:280px;border-radius:16px;border:1px solid #3a5a3e;}
    .result-box{margin:0 24px 24px 24px;background:#0c1410;border:1px solid #2a3a2e;border-radius:20px;display:none;}
    .result-header{display:flex;justify-content:space-between;padding:12px 16px;background:#111c16;border-bottom:1px solid #2a3a2e;}
    .result-actions button{background:none;border:none;color:#8aa69a;cursor:pointer;font-size:1.1rem;margin-left:12px;}
    .textarea-container{width:100%;background:#0a100e;color:#e2f0e6;padding:16px;min-height:240px;}
    .table-wrapper{overflow-x:auto;padding:16px;}
    table{width:100%;border-collapse:collapse;color:#e2f0e6;}
    th,td{padding:8px 12px;border:1px solid #2a3a2e;text-align:left;}
    th{background:#1e2a22;}
    .table-toggle{background:#1e2a22;border:1px solid #4ade80;border-radius:32px;padding:4px 12px;color:#b9ffb0;cursor:pointer;font-size:0.8rem;}
    .error-message{margin:0 24px 20px 24px;padding:12px;background:#5a2e2e;border-radius:12px;color:#ffc0c0;display:none;}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2a22;padding:10px 20px;border-radius:40px;border:1px solid #4ade80;z-index:1000;opacity:0;transition:opacity 0.3s;pointer-events:none;}
    footer{text-align:center;padding:24px;color:#5a7864;font-size:0.8rem;}
    .ocr-ready-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:0.75rem;margin:0 24px 12px 24px;}
    .ocr-ready-badge.loading{background:#3a3a1e;color:#ffff9e;}
    .ocr-ready-badge.ready{background:#1e3a22;color:#9eff9e;}
    .ocr-ready-badge.error{background:#3a1e1e;color:#ff9e9e;}
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="card-header">
      <h2>🧠 AI OCR · Table & Text Extractor</h2>
      <div class="ai-badge">⚡ Handwritten to Table</div>
    </div>

    <!-- OCR Engine Status -->
    <div id="ocrReadyBadge" class="ocr-ready-badge loading">⏳ OCR Engine Loading...</div>

    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">🖼️</div>
      <div class="drop-title">Click or drag image here</div>
      <div class="drop-sub">JPG, PNG, WebP, BMP (max 15MB) | Best for Tables</div>
      <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/webp,image/bmp" />
    </div>

    <div class="lang-row">
      <div class="lang-selector">
        <label>🌐 Language:</label>
        <select id="langSelect">
          <option value="eng">English</option>
          <option value="urd">اردو (Urdu) – RTL</option>
          <option value="hin">हिन्दी (Hindi)</option>
          <option value="ara">العربية (Arabic)</option>
          <option value="mar">मराठी (Marathi)</option>
          <option value="urd+eng+hin+ara+mar">⚡ AI Multi</option>
        </select>
      </div>
      <button class="btn-preprocess" id="preprocessBtn">✨ Enhance & Try Table Format</button>
    </div>

    <div class="progress-box" id="progressBox">
      <div class="progress-bar"><div class="progress-fill" id="ocrProgressFill"></div></div>
      <div class="status-text" id="ocrStatus">Ready</div>
    </div>

    <div class="image-preview" id="imagePreview">
      <img id="previewImg" alt="preview">
    </div>

    <div class="error-message" id="errorMsg"></div>

    <div class="result-box" id="resultBox">
      <div class="result-header">
        <span>📄 Extracted Text <span id="rtlHint"></span></span>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="table-toggle" id="tableViewToggle">📊 View Table</button>
          <button id="copyBtn" title="Copy">📋</button>
          <button id="downloadBtn" title="Download">💾</button>
          <button id="clearBtn" title="Clear">🗑️</button>
        </div>
      </div>
      <div id="resultContent" class="textarea-container">
        <div id="textView" style="white-space:pre-wrap;font-family:'Courier New',monospace;"></div>
        <div id="tableView" style="display:none;overflow-x:auto;"></div>
      </div>
    </div>
  </div>
  <footer>🔒 100% Client-Side OCR · Tesseract.js</footer>
</div>
<div id="toastMsg" class="toast"></div>

<script>
  // --- DOM Refs ---
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const langSelect = document.getElementById('langSelect');
  const preprocessBtn = document.getElementById('preprocessBtn');
  const progressBox = document.getElementById('progressBox');
  const progressFill = document.getElementById('ocrProgressFill');
  const ocrStatus = document.getElementById('ocrStatus');
  const imagePreview = document.getElementById('imagePreview');
  const previewImg = document.getElementById('previewImg');
  const resultBox = document.getElementById('resultBox');
  const textView = document.getElementById('textView');
  const tableView = document.getElementById('tableView');
  const tableViewToggle = document.getElementById('tableViewToggle');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const clearBtn = document.getElementById('clearBtn');
  const errorMsgDiv = document.getElementById('errorMsg');
  const toastDiv = document.getElementById('toastMsg');
  const rtlHint = document.getElementById('rtlHint');
  const ocrReadyBadge = document.getElementById('ocrReadyBadge');

  let currentFile = null;
  let currentImageBlob = null;
  let isTableView = false;
  let rawText = '';
  let parsedTableHtml = '';
  let tesseractReady = false;

  // --- Toast ---
  function showToast(msg, isError = false) {
    toastDiv.textContent = msg;
    toastDiv.style.backgroundColor = isError ? '#5a2e2e' : '#1e3a2a';
    toastDiv.style.opacity = '1';
    setTimeout(() => toastDiv.style.opacity = '0', 2500);
  }

  // --- Error ---
  function showError(msg) {
    errorMsgDiv.textContent = '❌ ' + msg;
    errorMsgDiv.style.display = 'block';
    setTimeout(() => errorMsgDiv.style.display = 'none', 6000);
    showToast(msg, true);
  }

  // --- RTL ---
  function setTextareaDirection(lang) {
    const rtl = lang === 'urd' || lang === 'ara' || (lang.includes('urd') && lang.includes('ara'));
    textView.style.direction = rtl ? 'rtl' : 'ltr';
    textView.style.textAlign = rtl ? 'right' : 'left';
    rtlHint.textContent = rtl ? ' (RTL mode)' : '';
  }

  // --- Wait for Tesseract ---
  function waitForTesseract(timeout = 15000) {
    return new Promise((resolve, reject) => {
      if (typeof Tesseract !== 'undefined') { resolve(); return; }
      const start = Date.now();
      const interval = setInterval(() => {
        if (typeof Tesseract !== 'undefined') {
          clearInterval(interval);
          resolve();
        } else if (Date.now() - start > timeout) {
          clearInterval(interval);
          reject(new Error('OCR engine failed to load. Check your internet connection.'));
        }
      }, 200);
    });
  }

  // --- Check Tesseract on load ---
  (async () => {
    try {
      await waitForTesseract(20000);
      tesseractReady = true;
      ocrReadyBadge.textContent = '✅ OCR Engine Ready';
      ocrReadyBadge.className = 'ocr-ready-badge ready';
    } catch (e) {
      ocrReadyBadge.textContent = '❌ OCR Engine Failed to Load';
      ocrReadyBadge.className = 'ocr-ready-badge error';
    }
  })();

  // --- Table Parser ---
  function parseTextToTable(text) {
    if (!text || text.trim().length < 10) return null;
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    if (lines.length < 2) return null;

    const rows = lines.map(line => line.trim().split(/\s{2,}/)).filter(cols => cols.length >= 2);
    if (rows.length < 2) return null;

    let maxCols = 0;
    rows.forEach(r => maxCols = Math.max(maxCols, r.length));

    let html = '<table><thead><tr>';
    rows[0].forEach(col => html += `<th>${col.trim()}</th>`);
    for (let i = rows[0].length; i < maxCols; i++) html += '<th></th>';
    html += '</tr></thead><tbody>';

    for (let i = 1; i < rows.length; i++) {
      html += '<tr>';
      rows[i].forEach(cell => html += `<td>${cell.trim()}</td>`);
      for (let j = rows[i].length; j < maxCols; j++) html += '<td></td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
  }

  // --- Update View ---
  function updateView() {
    if (!rawText) return;
    if (isTableView && parsedTableHtml) {
      tableView.innerHTML = parsedTableHtml;
      tableView.style.display = 'block';
      textView.style.display = 'none';
      tableViewToggle.textContent = '📝 View Text';
    } else {
      textView.textContent = rawText;
      tableView.style.display = 'none';
      textView.style.display = 'block';
      tableViewToggle.textContent = '📊 View Table';
    }
  }

  tableViewToggle.addEventListener('click', () => {
    isTableView = !isTableView;
    updateView();
  });

  // --- Image Preprocessing ---
  async function preprocessImageForOCR(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url); // revoke after load, not before
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let width = img.width, height = img.height;
        const minSize = 1200;
        if (width < minSize || height < minSize) {
          const scale = minSize / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        canvas.width = width;
        canvas.height = height;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);

        const imageData = ctx.getImageData(0, 0, width, height);
        const d = imageData.data;
        for (let i = 0; i < d.length; i += 4) {
          let gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          let bin = gray > 128 ? 255 : 0;
          d[i] = d[i+1] = d[i+2] = bin;
        }
        ctx.putImageData(imageData, 0, 0);
        canvas.toBlob(blob => resolve(blob), 'image/png', 0.95);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load failed')); };
      img.src = url;
    });
  }

  // --- Show Preview (fixed: keep URL alive) ---
  function showPreview(file) {
    // Revoke old URL if any
    if (previewImg._objectUrl) {
      URL.revokeObjectURL(previewImg._objectUrl);
    }
    const url = URL.createObjectURL(file);
    previewImg._objectUrl = url;
    previewImg.src = url;
    imagePreview.style.display = 'block';
  }

  // --- Main OCR ---
  async function runOCR(blob, lang) {
    if (!blob) { showError('No image selected'); return; }

    // Wait for Tesseract if not ready
    if (!tesseractReady) {
      ocrStatus.textContent = 'Waiting for OCR engine...';
      progressBox.style.display = 'block';
      try {
        await waitForTesseract(20000);
        tesseractReady = true;
      } catch (e) {
        showError('OCR engine not loaded. Refresh and try again.');
        progressBox.style.display = 'none';
        return;
      }
    }

    progressBox.style.display = 'block';
    progressFill.style.width = '5%';
    ocrStatus.textContent = 'Starting OCR...';
    resultBox.style.display = 'none';
    textView.textContent = '';
    tableView.innerHTML = '';
    tableView.style.display = 'none';
    textView.style.display = 'block';
    errorMsgDiv.style.display = 'none';
    isTableView = false;
    tableViewToggle.textContent = '📊 View Table';
    setTextareaDirection(lang);

    try {
      let langCode = lang;
      if (lang === 'hin' || lang === 'mar' || lang === 'urd') langCode = lang + '+eng';

      const result = await Tesseract.recognize(blob, langCode, {
        logger: m => {
          if (m.status === 'recognizing text') {
            const pct = Math.floor(m.progress * 100);
            progressFill.style.width = Math.min(90, 10 + pct * 0.8) + '%';
            ocrStatus.textContent = `Recognizing... ${pct}%`;
          } else if (m.status === 'loading language traineddata') {
            ocrStatus.textContent = `Loading language data...`;
            progressFill.style.width = '20%';
          } else if (m.status === 'initialized api') {
            ocrStatus.textContent = 'OCR initialized...';
            progressFill.style.width = '10%';
          }
        }
      });

      rawText = result.data.text.trim() || '⚠️ No text detected. Try Enhance button or better lighting.';
      parsedTableHtml = parseTextToTable(rawText);

      if (parsedTableHtml) {
        isTableView = true;
        showToast('✅ Table formatted!');
      } else {
        showToast('✅ Text extracted');
      }

      updateView();
      resultBox.style.display = 'block';
      progressFill.style.width = '100%';
      ocrStatus.textContent = '✅ Complete!';

    } catch (err) {
      console.error('OCR Error:', err);
      const msg = err.message || 'Processing failed';
      showError('OCR error: ' + msg);
      textView.textContent = 'Error: ' + msg;
      resultBox.style.display = 'block';
    } finally {
      setTimeout(() => { progressBox.style.display = 'none'; }, 1500);
    }
  }

  // --- Handle File ---
  async function handleImageFile(file) {
    if (!file || !file.type.startsWith('image/')) { showError('Please select an image file'); return; }
    if (file.size > 15 * 1024 * 1024) { showError('File too large (max 15MB)'); return; }
    currentFile = file;
    currentImageBlob = file;
    showPreview(file);
    runOCR(currentImageBlob, langSelect.value);
  }

  // --- Enhance Button ---
  preprocessBtn.addEventListener('click', async () => {
    if (!currentFile) { showError('No image loaded. Please select an image first.'); return; }
    showToast('Enhancing image...');
    try {
      const enhanced = await preprocessImageForOCR(currentFile);
      currentImageBlob = enhanced;
      // Show enhanced preview
      if (previewImg._objectUrl) URL.revokeObjectURL(previewImg._objectUrl);
      const url = URL.createObjectURL(enhanced);
      previewImg._objectUrl = url;
      previewImg.src = url;
      imagePreview.style.display = 'block';
      await runOCR(currentImageBlob, langSelect.value);
    } catch (err) {
      showError('Enhance failed: ' + err.message);
    }
  });

  // --- Language Change ---
  langSelect.addEventListener('change', () => {
    if (currentImageBlob) runOCR(currentImageBlob, langSelect.value);
  });

  // --- Drop Zone ---
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    if (fileInput.files[0]) handleImageFile(fileInput.files[0]);
  });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleImageFile(file);
    else showError('Please drop an image file');
  });

  // --- Action Buttons ---
  copyBtn.onclick = () => {
    const txt = rawText;
    if (!txt || !txt.trim()) { showToast('Nothing to copy', true); return; }
    navigator.clipboard.writeText(txt).then(() => showToast('✅ Copied!')).catch(() => showToast('Copy failed', true));
  };

  downloadBtn.onclick = () => {
    if (!rawText || !rawText.trim()) { showToast('Nothing to download', true); return; }
    const blob = new Blob([rawText], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ocr_result_${Date.now()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  };

  clearBtn.onclick = () => {
    rawText = '';
    parsedTableHtml = '';
    textView.textContent = '';
    tableView.innerHTML = '';
    resultBox.style.display = 'none';
    imagePreview.style.display = 'none';
    if (previewImg._objectUrl) { URL.revokeObjectURL(previewImg._objectUrl); previewImg._objectUrl = null; }
    previewImg.src = '';
    currentImageBlob = null;
    currentFile = null;
    fileInput.value = '';
    showToast('Cleared');
  };
</script>
</body>
</html>
