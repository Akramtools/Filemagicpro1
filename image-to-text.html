<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI OCR – Hindi, Marathi, Urdu, Arabic, English | FileMagic Pro</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0a0f0d;font-family:'Segoe UI',system-ui,sans-serif;color:#e2f0e6;padding:20px;}
    .container{max-width:1100px;margin:0 auto;}
    .card{background:#141e18;border-radius:28px;border:1px solid #2a3a2e;margin-bottom:24px;}
    .card-header{padding:20px 24px;background:#0f1712;border-bottom:1px solid #2a3a2e;display:flex;justify-content:space-between;flex-wrap:wrap;}
    .card-header h2{font-size:1.6rem;background:linear-gradient(135deg,#b9ffb0,#4ade80);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .ai-badge{background:#1e2a22;padding:4px 12px;border-radius:40px;font-size:0.7rem;color:#9eff9e;}
    .drop-zone{border:2px dashed #3a5a3e;border-radius:24px;margin:24px;padding:48px 24px;text-align:center;cursor:pointer;background:#0c1410;transition:0.2s;}
    .drop-zone.drag-over{border-color:#4ade80;background:#1e2e22;}
    .drop-icon{font-size:3rem;}
    .drop-title{font-weight:600;font-size:1.1rem;margin:8px 0 4px;}
    .drop-sub{font-size:0.8rem;color:#8aa69a;}
    .file-input{display:none;}
    .lang-row{display:flex;flex-wrap:wrap;gap:12px;margin:0 24px 16px 24px;align-items:center;justify-content:space-between;}
    .lang-selector select{background:#0c1410;border:1px solid #3a5a3e;border-radius:32px;padding:8px 16px;color:#e2f0e6;}
    .btn-preprocess{background:#2a4a2e;border:none;border-radius:32px;padding:8px 18px;color:white;cursor:pointer;}
    .progress-box{margin:0 24px 20px 24px;display:none;}
    .progress-bar{height:6px;background:#2a3a2e;border-radius:6px;overflow:hidden;}
    .progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#4ade80,#a0ffa0);transition:width 0.2s;}
    .status-text{font-size:0.8rem;color:#9abfaa;text-align:center;margin-top:8px;}
    .image-preview{margin:0 24px 16px 24px;display:none;text-align:center;}
    .image-preview img{max-width:100%;max-height:280px;border-radius:16px;border:1px solid #3a5a3e;}
    .result-box{margin:0 24px 24px 24px;background:#0c1410;border:1px solid #2a3a2e;border-radius:20px;display:none;}
    .result-header{display:flex;justify-content:space-between;padding:12px 16px;background:#111c16;border-bottom:1px solid #2a3a2e;}
    .result-actions button{background:none;border:none;color:#8aa69a;cursor:pointer;font-size:1.1rem;margin-left:12px;}
    textarea{width:100%;background:#0a100e;border:none;color:#e2f0e6;font-family:'Courier New',monospace;font-size:0.9rem;padding:16px;min-height:240px;resize:vertical;outline:none;}
    .error-message{margin:0 24px 20px 24px;padding:12px;background:#5a2e2e;border-radius:12px;color:#ffc0c0;display:none;}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2a22;padding:10px 20px;border-radius:40px;border:1px solid #4ade80;z-index:1000;opacity:0;transition:opacity 0.3s;pointer-events:none;}
    footer{text-align:center;padding:24px;color:#5a7864;font-size:0.8rem;}
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="card-header">
      <h2>🧠 AI OCR · Urdu + Hindi + Arabic + English</h2>
      <div class="ai-badge">⚡ RTL Support | Fixed Urdu OCR</div>
    </div>
    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">🖼️</div>
      <div class="drop-title">Click or drag image here</div>
      <div class="drop-sub">JPG, PNG, WebP, BMP (max 15MB)</div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/bmp" />
    </div>
    <div class="lang-row">
      <div class="lang-selector">
        <label>🌐 Language:</label>
        <select id="langSelect">
          <option value="eng">English</option>
          <option value="urd">اردو (Urdu) – RTL</option>
          <option value="hin">हिन्दी (Hindi)</option>
          <option value="ara">العربية (Arabic)</option>
          <option value="mar">मराठी (Marathi)</option>
          <option value="urd+eng+hin+ara+mar">⚡ AI Multi (Urdu+Eng+Hin+Ara+Mar)</option>
        </select>
      </div>
      <button class="btn-preprocess" id="preprocessBtn">✨ Enhance Image (Camera & Screenshot)</button>
    </div>
    <div class="progress-box" id="progressBox">
      <div class="progress-bar"><div class="progress-fill" id="ocrProgressFill"></div></div>
      <div class="status-text" id="ocrStatus">Ready</div>
    </div>
    <div class="image-preview" id="imagePreview">
      <img id="previewImg" alt="preview">
    </div>
    <div class="error-message" id="errorMsg"></div>
    <div class="result-box" id="resultBox">
      <div class="result-header">
        <span>📄 Extracted Text <span id="rtlHint"></span></span>
        <div class="result-actions">
          <button id="copyBtn">📋</button>
          <button id="downloadBtn">💾</button>
          <button id="clearBtn">🗑️</button>
        </div>
      </div>
      <textarea id="ocrTextArea" placeholder="Extracted text will appear here..."></textarea>
    </div>
  </div>
  <footer>🔒 100% client-side · "Enhance Image" now uses AI-powered Sharpening + Binarization for best results.</footer>
</div>
<div id="toastMsg" class="toast"></div>

<script>
  // DOM elements
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const langSelect = document.getElementById('langSelect');
  const preprocessBtn = document.getElementById('preprocessBtn');
  const progressBox = document.getElementById('progressBox');
  const progressFill = document.getElementById('ocrProgressFill');
  const ocrStatus = document.getElementById('ocrStatus');
  const imagePreview = document.getElementById('imagePreview');
  const previewImg = document.getElementById('previewImg');
  const resultBox = document.getElementById('resultBox');
  const ocrTextArea = document.getElementById('ocrTextArea');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const clearBtn = document.getElementById('clearBtn');
  const errorMsgDiv = document.getElementById('errorMsg');
  const toastDiv = document.getElementById('toastMsg');
  const rtlHint = document.getElementById('rtlHint');

  let currentImageBlob = null;
  let currentFile = null;

  function showToast(msg, isError = false) {
    toastDiv.textContent = msg;
    toastDiv.style.backgroundColor = isError ? '#5a2e2e' : '#1e3a2a';
    toastDiv.style.opacity = '1';
    setTimeout(() => toastDiv.style.opacity = '0', 2500);
  }
  function showError(msg) {
    errorMsgDiv.textContent = '❌ ' + msg;
    errorMsgDiv.style.display = 'block';
    setTimeout(() => errorMsgDiv.style.display = 'none', 5000);
    showToast(msg, true);
  }

  // RTL handling for Urdu/Arabic
  function setTextareaDirection(lang) {
    if (lang === 'urd' || lang === 'ara' || (lang.includes('urd') && lang.includes('ara'))) {
      ocrTextArea.style.direction = 'rtl';
      ocrTextArea.style.textAlign = 'right';
      rtlHint.innerHTML = ' (RTL mode: Urdu/Arabic)';
    } else {
      ocrTextArea.style.direction = 'ltr';
      ocrTextArea.style.textAlign = 'left';
      rtlHint.innerHTML = '';
    }
  }

  // ================================================================
  // 🔥 UPDATED: FIX FOR CAMERA & SCREENSHOT (Image Pre-processing)
  // ================================================================
  async function preprocessImageForOCR(file, isUrdu = false) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // 1. RESIZE (Critical for small text or tiny screenshots)
        let width = img.width;
        let height = img.height;
        const minSize = 1200; // Minimum width/height to ensure text is readable
        
        if (width < minSize || height < minSize) {
          const scale = minSize / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        
        canvas.width = width;
        canvas.height = height;
        
        // Draw image and scale up with high-quality interpolation
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);
        
        // 2. GET PIXEL DATA
        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;
        
        // 3. GRAYSCALE & SHARPEN (Only for Camera/Screenshot)
        for (let i = 0; i < data.length; i += 4) {
          let r = data[i];
          let g = data[i+1];
          let b = data[i+2];
          // Convert to grayscale
          let gray = 0.299 * r + 0.587 * g + 0.114 * b;
          data[i] = gray;
          data[i+1] = gray;
          data[i+2] = gray;
        }
        
        // 4. SHARPENING KERNEL (Unsharp Masking)
        // This fixes the broken "Shirorekha" (Top line) in Hindi/Marathi
        ctx.putImageData(imageData, 0, 0);
        
        // Apply sharpening effect
        const imgData = ctx.getImageData(0, 0, width, height);
        const data2 = imgData.data;
        const kernel = [
          [0, -1, 0],
          [-1, 5, -1],
          [0, -1, 0]
        ];
        const side = Math.round(kernel.length / 2);
        
        const output = new Uint8ClampedArray(data2.length);
        
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            let r = 0, g = 0, b = 0;
            for (let ky = -side + 1; ky < side; ky++) {
              for (let kx = -side + 1; kx < side; kx++) {
                const idx = (y + ky) * width + (x + kx);
                if (idx >= 0 && idx < width * height) {
                  const pixelIdx = idx * 4;
                  const weight = kernel[ky + side - 1][kx + side - 1];
                  r += data2[pixelIdx] * weight;
                  g += data2[pixelIdx + 1] * weight;
                  b += data2[pixelIdx + 2] * weight;
                }
              }
            }
            const pixelIdx = (y * width + x) * 4;
            output[pixelIdx] = Math.min(255, Math.max(0, r));
            output[pixelIdx + 1] = Math.min(255, Math.max(0, g));
            output[pixelIdx + 2] = Math.min(255, Math.max(0, b));
            output[pixelIdx + 3] = 255;
          }
        }
        
        // 5. HIGH CONTRAST BINARIZATION (Black & White)
        // This is the most crucial step for camera photos with shadows/glare
        for (let i = 0; i < output.length; i += 4) {
          let val = output[i];
          // Fixed threshold. 128 is good if image is clean, but 100-150 works best for b/w
          let thresh = 128; 
          let binary = val > thresh ? 255 : 0;
          output[i] = binary;
          output[i+1] = binary;
          output[i+2] = binary;
        }
        
        ctx.putImageData(new ImageData(output, width, height), 0, 0);
        
        // 6. FINAL EXPORT
        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          resolve(blob);
        }, file.type, 0.95);
      };
      img.onerror = () => reject(new Error('Image load failed'));
      img.src = url;
    });
  }
  // ================================================================

  // Generic enhance wrapper (Now uses the robust preprocessImageForOCR)
  async function enhanceImage(file, isUrdu = false) {
    return preprocessImageForOCR(file, isUrdu);
  }

  async function performOCR(blob, lang) {
    if (!blob) throw new Error('No image');
    if (typeof Tesseract === 'undefined') throw new Error('OCR library loading... wait or refresh');
    
    // BEST PRACTICE: For Hindi, always add 'eng' to the language string for better accuracy
    let langCode = lang;
    if (lang === 'hin' || lang === 'mar' || lang === 'urd') {
        langCode = lang + '+eng'; 
    }
    
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('OCR Timeout')), 120000); // 2 min
      Tesseract.recognize(blob, langCode, {
        logger: m => {
          if (m.status === 'recognizing text') {
            let pct = Math.floor(m.progress * 100);
            progressFill.style.width = Math.min(90, 10 + pct * 0.8) + '%';
            ocrStatus.textContent = `Recognizing... ${pct}% (${lang})`;
          } else if (m.status === 'loading language traineddata') {
            ocrStatus.textContent = `Loading language: ${langCode} ...`;
            progressFill.style.width = '25%';
          }
        }
      }).then(result => {
        clearTimeout(timeout);
        resolve(result.data.text);
      }).catch(err => {
        clearTimeout(timeout);
        reject(err);
      });
    });
  }

  async function runOCR(blob, lang) {
    if (!blob) { showError('No image'); return; }
    progressBox.style.display = 'block';
    progressFill.style.width = '0%';
    ocrStatus.textContent = `Starting OCR with ${lang}...`;
    resultBox.style.display = 'none';
    ocrTextArea.value = '';
    errorMsgDiv.style.display = 'none';
    setTextareaDirection(lang);
    try {
      const text = await performOCR(blob, lang);
      const final = text.trim() || '⚠️ No text detected. Try enhancing or better lighting.';
      ocrTextArea.value = final;
      resultBox.style.display = 'block';
      progressFill.style.width = '100%';
      ocrStatus.textContent = 'Complete!';
      showToast('✅ Text extracted');
      
      // Warning if result is too short (Indicates a failure)
      if (final.length < 10 && final.trim() !== '') {
         showError('Very little text detected. Click "Enhance Image" to fix camera/screenshot issues.');
      }
    } catch (err) {
      console.error(err);
      showError('OCR error: ' + (err.message || 'Processing failed. Click "Enhance Image" to fix.'));
      ocrTextArea.value = 'Error: ' + (err.message || 'Processing failed. Try the "Enhance Image" button.');
      resultBox.style.display = 'block';
    } finally {
      setTimeout(() => { progressBox.style.display = 'none'; }, 1000);
    }
  }

  async function handleImageFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      showError('Please select an image (JPG, PNG, WebP, BMP)');
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      showError('File too large (max 15MB)');
      return;
    }
    currentFile = file;
    currentImageBlob = file;
    // Show preview
    const url = URL.createObjectURL(file);
    previewImg.src = url;
    imagePreview.style.display = 'block';
    URL.revokeObjectURL(url);
    // Get selected language
    let lang = langSelect.value;
    runOCR(currentImageBlob, lang);
  }

  // NEW: Updated Enhance logic
  preprocessBtn.addEventListener('click', async () => {
    if (!currentFile) { showError('No image loaded'); return; }
    const selectedLang = langSelect.value;
    const isUrdu = selectedLang.includes('urd') || selectedLang === 'urd';
    
    showToast(isUrdu ? 'Applying Advanced Pre-processing (Binarization + Sharpening)...' : 'Enhancing contrast and sharpening...');
    
    try {
      // Apply the robust preprocessing function
      let enhanced = await preprocessImageForOCR(currentFile, isUrdu);
      
      currentImageBlob = enhanced;
      const url = URL.createObjectURL(enhanced);
      previewImg.src = url;
      URL.revokeObjectURL(url);
      
      await runOCR(currentImageBlob, selectedLang);
    } catch (err) {
      showError('Enhance failed: ' + err.message);
    }
  });

  // Language change: re-run OCR with current image
  langSelect.addEventListener('change', async () => {
    if (currentImageBlob) {
      const newLang = langSelect.value;
      setTextareaDirection(newLang);
      await runOCR(currentImageBlob, newLang);
    }
  });

  // Drag & drop and click events
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    if (fileInput.files[0]) handleImageFile(fileInput.files[0]);
  });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', async e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleImageFile(file);
    else showError('Drop an image file');
  });

  copyBtn.onclick = () => {
    if (!ocrTextArea.value.trim()) { showToast('No text', true); return; }
    navigator.clipboard.writeText(ocrTextArea.value).then(() => showToast('Copied'));
  };
  downloadBtn.onclick = () => {
    const txt = ocrTextArea.value;
    if (!txt.trim()) { showToast('No text', true); return; }
    const blob = new Blob([txt], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ocr_text_${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  clearBtn.onclick = () => {
    ocrTextArea.value = '';
    resultBox.style.display = 'none';
    imagePreview.style.display = 'none';
    previewImg.src = '';
    currentImageBlob = null;
    currentFile = null;
    fileInput.value = '';
    showToast('Cleared');
  };

  // Load Tesseract if not present
  if (typeof Tesseract === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js';
    script.onload = () => { console.log('Tesseract ready'); showToast('OCR engine ready'); };
    script.onerror = () => showError('Failed to load OCR library. Check internet.');
    document.head.appendChild(script);
  } else {
    console.log('Tesseract already loaded');
  }
</script>
</body>
</html>
