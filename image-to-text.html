<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileMagicPro | AI Image to Text Extractor</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:#0a0f0d;font-family:'Segoe UI', system-ui, -apple-system, sans-serif;color:#e2f0e6;padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .container{max-width:820px;width:100%;margin:0 auto;}
        
        .card{background:#141e18;border-radius:24px;border:1px solid rgba(42, 58, 46, 0.6);box-shadow:0 25px 50px -12px rgba(0, 0, 0, 0.8);overflow:hidden;backdrop-filter:blur(2px);margin-bottom:20px;}
        .card-header{padding:20px 28px;background:linear-gradient(180deg, #0f1712 0%, #141e18 100%);border-bottom:1px solid #2a3a2e;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
        
        .logo-area{display:flex;align-items:center;gap:14px;}
        .logo-icon{background:#1e2a22;padding:8px;border-radius:14px;border:1px solid #2a3a2e;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(74, 222, 128, 0.05);}
        .brand-text{display:flex;flex-direction:column;}
        .brand-title{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg, #b9ffb0 0%, #4ade80 100%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.5px;line-height:1.2;}
        .brand-sub{font-size:0.8rem;color:#8aa69a;font-weight:500;margin-top:-2px;letter-spacing:0.5px;}
        .brand-badge{background:rgba(30, 42, 34, 0.8);padding:6px 16px;border-radius:40px;font-size:0.75rem;font-weight:600;color:#b9ffb0;border:1px solid #4ade80;backdrop-filter:blur(4px);box-shadow:0 0 20px rgba(74, 222, 128, 0.15);}

        .drop-zone{border:2px dashed rgba(58, 90, 62, 0.8);border-radius:20px;margin:24px;padding:48px 24px;text-align:center;cursor:pointer;background:#0c1410;transition:0.3s ease;}
        .drop-zone.drag-over{border-color:#4ade80;background:rgba(30, 42, 34, 0.6);box-shadow:inset 0 0 30px rgba(74, 222, 128, 0.05);}
        .drop-icon{font-size:3.5rem;margin-bottom:10px;opacity:0.9;}
        .drop-title{font-weight:600;font-size:1.15rem;margin-bottom:4px;}
        .drop-sub{font-size:0.85rem;color:#8aa69a;}
        .file-input{display:none;}

        .image-preview{display:none;text-align:center;margin:0 24px 16px 24px;}
        .image-preview img{max-width:100%;max-height:280px;border-radius:16px;border:1px solid #2a3a2e;background:#000;box-shadow:0 4px 15px rgba(0,0,0,0.5);}

        .controls-row{display:flex;flex-wrap:wrap;gap:12px;margin:0 24px 16px 24px;justify-content:center;align-items:center;}
        .btn{background:#1e2a22;border:1px solid #2a3a2e;border-radius:32px;padding:12px 22px;color:#e2f0e6;cursor:pointer;font-weight:600;transition:0.2s;font-size:0.95rem;}
        .btn:hover{background:#2a3a2e;transform:translateY(-1px);}
        .btn-primary{background:linear-gradient(135deg, #1a5c2e, #238636);border-color:#238636;color:white;box-shadow:0 2px 10px rgba(35, 134, 54, 0.3);}
        .btn-primary:hover{background:linear-gradient(135deg, #2ea043, #238636);box-shadow:0 4px 15px rgba(35, 134, 54, 0.5);}
        .btn-danger{background:#5a2e2e;border-color:#5a2e2e;color:#ffc0c0;}
        .btn-danger:hover{background:#6a3e3e;}

        /* Language Selector Styling */
        select.lang-select{background:#0c1410;border:1px solid #2a3a2e;padding:12px 20px;border-radius:32px;color:#e2f0e6;font-weight:600;outline:none;cursor:pointer;font-size:0.95rem;}
        select.lang-select option{background:#141e18;color:#e2f0e6;}

        .progress-box{display:none;margin:0 24px 20px 24px;}
        .progress-bar{height:6px;background:#2a3a2e;border-radius:6px;overflow:hidden;}
        .progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#4ade80,#a0ffa0);transition:width 0.2s;}
        .status-text{font-size:0.8rem;color:#9abfaa;text-align:center;margin-top:8px;}

        .result-box{margin:0 24px 24px 24px;background:#0c1410;border:1px solid #2a3a2e;border-radius:16px;display:none;overflow:hidden;}
        .result-header{display:flex;justify-content:space-between;padding:12px 16px;background:#111c16;border-bottom:1px solid #2a3a2e;align-items:center;}
        .result-actions{display:flex;gap:8px;}
        .result-actions button{background:none;border:none;color:#8aa69a;cursor:pointer;font-size:1.1rem;padding:4px;transition:0.2s;}
        .result-actions button:hover{color:#4ade80;transform:scale(1.1);}
        textarea{width:100%;background:#0a100e;border:none;color:#e2f0e6;font-family:'Consolas','Courier New',monospace;font-size:0.95rem;padding:16px;min-height:220px;resize:vertical;outline:none;}

        .error-message{margin:0 24px 20px 24px;padding:12px;background:#5a2e2e;border-radius:12px;color:#ffc0c0;display:none;border:1px solid #f85149;}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2a22;padding:12px 24px;border-radius:40px;border:1px solid #4ade80;z-index:1000;opacity:0;transition:opacity 0.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,0.7);}
        footer{text-align:center;padding:16px;color:#5a7864;font-size:0.8rem;}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2Z" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 2V8H20" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 18V12" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 15L12 12L15 15" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-title">FileMagicPro</span>
                    <span class="brand-sub">Image to Text</span>
                </div>
            </div>
            <div class="brand-badge">⚡ Smart Text Extractor</div>
        </div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-icon">🖼️</div>
            <div class="drop-title">Click or drag image here</div>
            <div class="drop-sub">JPG, PNG, WebP (Max 15MB) | Low quality & Handwriting support</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/bmp" />
        </div>

        <div class="image-preview" id="imagePreview">
            <img id="previewImg" alt="Uploaded Preview">
        </div>

        <!-- Language Dropdown + Controls -->
        <div class="controls-row">
            <div style="display:flex;align-items:center;gap:8px;">
                <label for="langSelect" style="font-weight:600;color:#9abfaa;">🌐</label>
                <select id="langSelect" class="lang-select">
                    <option value="eng">🇬🇧 English</option>
                    <option value="hin">🇮🇳 हिन्दी</option>
                    <option value="urd">🇵🇰 اردو</option>
                    <option value="ara">🇸🇦 العربية</option>
                    <!-- Multi-Language Auto Detect mode -->
                    <option value="eng+hin+urd+ara+fra+deu+spa" selected>🌍 Auto Detect (Multi-Language)</option>
                </select>
            </div>
            
            <button class="btn btn-primary" id="enhanceBtn">✨ Enhance Image</button>
            <button class="btn btn-danger" id="clearBtn">🗑️ Clear All</button>
        </div>

        <div class="progress-box" id="progressBox">
            <div class="progress-bar"><div class="progress-fill" id="ocrProgressFill"></div></div>
            <div class="status-text" id="ocrStatus">Ready</div>
        </div>

        <div class="error-message" id="errorMsg"></div>

        <div class="result-box" id="resultBox">
            <div class="result-header">
                <span style="font-weight:500;color:#9abfaa;">📝 Extracted Text</span>
                <div class="result-actions">
                    <button id="copyBtn" title="Copy Text">📋</button>
                    <button id="downloadBtn" title="Download .txt">💾</button>
                </div>
            </div>
            <textarea id="outputText" placeholder="Extracted text will appear here..."></textarea>
        </div>
    </div>
    
    <footer>FileMagicPro · 100% Client-side (Tesseract.js) · First-time 'Auto Detect' loads Multi-Language pack (~15MB).</footer>
</div>

<div id="toastMsg" class="toast"></div>

<script src='https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js'></script>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewImg = document.getElementById('previewImg');
    const imagePreview = document.getElementById('imagePreview');
    const langSelect = document.getElementById('langSelect');
    
    const progressBox = document.getElementById('progressBox');
    const progressFill = document.getElementById('ocrProgressFill');
    const ocrStatus = document.getElementById('ocrStatus');
    
    const outputText = document.getElementById('outputText');
    const resultBox = document.getElementById('resultBox');
    const errorMsgDiv = document.getElementById('errorMsg');
    const toastDiv = document.getElementById('toastMsg');
    
    const enhanceBtn = document.getElementById('enhanceBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentImageBlob = null;

    function showToast(msg, isError = false) {
        toastDiv.textContent = msg;
        toastDiv.style.backgroundColor = isError ? '#5a2e2e' : '#1e3a2a';
        toastDiv.style.opacity = '1';
        setTimeout(() => toastDiv.style.opacity = '0', 2500);
    }
    function showError(msg) {
        errorMsgDiv.innerHTML = '❌ ' + msg;
        errorMsgDiv.style.display = 'block';
        setTimeout(() => errorMsgDiv.style.display = 'none', 6000);
        showToast(msg, true);
    }

    // ==========================================================
    // 🧠 ADVANCED IMAGE PRE-PROCESSING
    // ==========================================================
    function preprocessImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                let width = img.width;
                let height = img.height;
                const minSize = 1200; 
                if (width < minSize || height < minSize) {
                    const scale = minSize / Math.max(width, height);
                    width = Math.round(width * scale);
                    height = Math.round(height * scale);
                }
                
                canvas.width = width;
                canvas.height = height;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, width, height);

                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;
                
                const kernel = [[0, -1, 0],[-1, 5, -1],[0, -1, 0]];
                const side = Math.round(kernel.length / 2);
                const output = new Uint8ClampedArray(data.length);

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        let r = 0, g = 0, b = 0;
                        for (let ky = -side + 1; ky < side; ky++) {
                            for (let kx = -side + 1; kx < side; kx++) {
                                const idx = (y + ky) * width + (x + kx);
                                if (idx >= 0 && idx < width * height) {
                                    const pixelIdx = idx * 4;
                                    const weight = kernel[ky + side - 1][kx + side - 1];
                                    r += data[pixelIdx] * weight;
                                    g += data[pixelIdx + 1] * weight;
                                    b += data[pixelIdx + 2] * weight;
                                }
                            }
                        }
                        const pixelIdx = (y * width + x) * 4;
                        output[pixelIdx] = Math.min(255, Math.max(0, r));
                        output[pixelIdx + 1] = Math.min(255, Math.max(0, g));
                        output[pixelIdx + 2] = Math.min(255, Math.max(0, b));
                        output[pixelIdx + 3] = 255;
                    }
                }

                let threshold = 115; 
                for (let i = 0; i < output.length; i += 4) {
                    let val = output[i];
                    let binary = val > threshold ? 255 : 0;
                    output[i] = binary;
                    output[i+1] = binary;
                    output[i+2] = binary;
                }

                ctx.putImageData(new ImageData(output, width, height), 0, 0);
                canvas.toBlob(blob => {
                    URL.revokeObjectURL(url);
                    resolve(blob);
                }, 'image/png', 1.0);
            };
            img.onerror = () => reject(new Error('Image load failed'));
            img.src = url;
        });
    }

    // ==========================================================
    // 🚀 MAIN OCR ENGINE (Multi-Language Support)
    // ==========================================================
    async function runOCR(blob) {
        if (!blob) { showError('No image loaded'); return; }
        
        // Get selected language from dropdown
        const selectedLang = langSelect.value;
        const isMultiLang = selectedLang.includes('+');
        
        progressBox.style.display = 'block';
        progressFill.style.width = '0%';
        ocrStatus.textContent = `Initializing Tesseract...`;
        resultBox.style.display = 'none';
        outputText.value = '';
        errorMsgDiv.style.display = 'none';
        showToast('Processing image...');

        try {
            const result = await Tesseract.recognize(
                blob,
                selectedLang, // 🔥 Language pack automatically applies here
                {
                    logger: m => {
                        if (m.status === 'loading language traineddata') {
                            if(isMultiLang) {
                                ocrStatus.textContent = '🌍 Downloading Auto-Detect Model (1st time, ~15MB)...';
                            } else {
                                ocrStatus.textContent = `Downloading Language Model...`;
                            }
                            progressFill.style.width = '15%';
                        } else if (m.status === 'initializing tesseract') {
                            ocrStatus.textContent = 'Starting Engine...';
                            progressFill.style.width = '30%';
                        } else if (m.status === 'recognizing text') {
                            let pct = Math.floor(m.progress * 100);
                            progressFill.style.width = Math.min(95, 30 + pct * 0.65) + '%';
                            ocrStatus.textContent = `Reading text... ${pct}%`;
                        }
                    }
                }
            );

            const finalText = result.data.text.trim();
            progressFill.style.width = '100%';
            ocrStatus.textContent = '✅ Extraction Complete!';
            showToast('Text extracted successfully!');

            if (finalText.length === 0) {
                showError("Couldn't find text. Try 'Enhance Image' or a clearer photo.");
                setTimeout(() => progressBox.style.display = 'none', 1000);
                return;
            }

            outputText.value = finalText;
            resultBox.style.display = 'block';
            
            setTimeout(() => progressBox.style.display = 'none', 1500);

        } catch (err) {
            console.error(err);
            showError('OCR Error: ' + (err.message || 'Processing failed. Try enhancing the image.'));
            setTimeout(() => progressBox.style.display = 'none', 1000);
        }
    }

    // ==========================================================
    // HANDLING FILE UPLOAD & EVENTS
    // ==========================================================
    async function handleImageFile(file) {
        if (!file || !file.type.startsWith('image/')) { showError('Please select a valid image'); return; }
        if (file.size > 15 * 1024 * 1024) { showError('File is too large (Max 15MB)'); return; }

        currentImageBlob = file;
        
        const url = URL.createObjectURL(file);
        previewImg.src = url;
        imagePreview.style.display = 'block';
        URL.revokeObjectURL(url);

        await runOCR(file);
    }

    enhanceBtn.addEventListener('click', async () => {
        if (!currentImageBlob) { showError('No image uploaded yet!'); return; }
        showToast('Enhancing image for low quality...', false);
        try {
            let enhancedBlob = await preprocessImage(currentImageBlob);
            currentImageBlob = enhancedBlob;
            const url = URL.createObjectURL(enhancedBlob);
            previewImg.src = url;
            await runOCR(enhancedBlob);
        } catch (err) {
            showError('Enhance failed: ' + err.message);
        }
    });

    clearBtn.addEventListener('click', () => {
        currentImageBlob = null;
        imagePreview.style.display = 'none';
        previewImg.src = '';
        resultBox.style.display = 'none';
        outputText.value = '';
        fileInput.value = '';
        progressBox.style.display = 'none';
        errorMsgDiv.style.display = 'none';
        showToast('Cleared successfully');
    });

    copyBtn.addEventListener('click', () => {
        if (!outputText.value.trim()) { showToast('No text to copy', true); return; }
        navigator.clipboard.writeText(outputText.value).then(() => showToast('Copied to clipboard!'));
    });
    downloadBtn.addEventListener('click', () => {
        const txt = outputText.value;
        if (!txt.trim()) { showToast('No text to download', true); return; }
        const blob = new Blob([txt], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `FileMagicPro_Text_${Date.now()}.txt`;
        a.click();
        URL.revokeObjectURL(a.href);
    });

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => { if (e.target.files[0]) handleImageFile(e.target.files[0]); });
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) handleImageFile(file);
        else showError('Drop an image file');
    });
</script>
</body>
</html>
